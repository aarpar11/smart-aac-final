    // --- MAIN REACT AAC APPLICATION ---
    function SmartAACApp() {
      // Boards & Navigation state
      const [boards, setBoards] = useState(() => {
        try {
          const saved = localStorage.getItem("smart_aac_boards");
          return saved ? JSON.parse(saved) : PRESET_BOARDS;
        } catch (e) {
          return PRESET_BOARDS;
        }
      });
      const [currentBoardId, setCurrentBoardId] = useState("core_home");
      const [navigationStack, setNavigationStack] = useState([]);

      // Sentence Composer state
      const [sentence, setSentence] = useState([]);
      const [suggestedWords, setSuggestedWords] = useState(["I", "want", "like", "go", "help", "more"]);
      const [isSpeaking, setIsSpeaking] = useState(false);

      // Vision & Emotion Detection state
      const [isCameraEnabled, setIsCameraEnabled] = useState(true);
      const [detectedEmotion, setDetectedEmotion] = useState("neutral");
      const [manualEmotion, setManualEmotion] = useState(null);
      const [isEmotionSortingEnabled, setIsEmotionSortingEnabled] = useState(true);
      const [dwellProgress, setDwellProgress] = useState(0);
      const [dwellTrigger, setDwellTrigger] = useState("NONE");
      const [cameraStatus, setCameraStatus] = useState("Ready");

      // Preferences & Display Settings
      const [isHighContrast, setIsHighContrast] = useState(false);
      const [gridColumns, setGridColumns] = useState(4); // 3 or 4
      const [cardDisplayMode, setCardDisplayMode] = useState("BOTH"); // BOTH, ICON_ONLY, TEXT_ONLY
      const [labelPosition, setLabelPosition] = useState("BOTTOM"); // TOP or BOTTOM
      const [speakOnTileTap, setSpeakOnTileTap] = useState(false);
      const [skinTone, setSkinTone] = useState("DEFAULT"); // DEFAULT, LIGHT, MEDIUM_LIGHT, MEDIUM, MEDIUM_DARK, DARK
      const [speechRate, setSpeechRate] = useState(1.0);
      const [speechPitch, setSpeechPitch] = useState(1.0);

      // UI Modals
      const [isEditMode, setIsEditMode] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showCustomizerModal, setShowCustomizerModal] = useState(false);
      const [selectedCardForEdit, setSelectedCardForEdit] = useState(null);

      // OpenSymbols Search state
      const [searchQuery, setSearchQuery] = useState("");
      const [searchResults, setSearchResults] = useState([]);
      const [isSearching, setIsSearching] = useState(false);
      const [newCardLabel, setNewCardLabel] = useState("");
      const [newCardSpeech, setNewCardSpeech] = useState("");
      const [newCardCategory, setNewCardCategory] = useState("NOUN");
      const [newCardIcon, setNewCardIcon] = useState("✨");

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const activeEmotion = manualEmotion || detectedEmotion;

      // --- SAVE BOARDS ON CHANGE ---
      useEffect(() => {
        try {
          localStorage.setItem("smart_aac_boards", JSON.stringify(boards));
        } catch (e) {}
      }, [boards]);

      // --- SPEECH SYNTHESIS ENGINE ---
      const speakText = (text, pitchMult = 1.0, rateMult = 1.0) => {
        if (!text) return;
        setIsSpeaking(true);
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = speechRate * rateMult;
          utterance.pitch = speechPitch * pitchMult;
          utterance.onend = () => setIsSpeaking(false);
          utterance.onerror = () => setIsSpeaking(false);
          window.speechSynthesis.speak(utterance);
        } else {
          // Native Android Bridge Fallback
          if (window.AndroidAACBridge && window.AndroidAACBridge.speakText) {
            window.AndroidAACBridge.speakText(text, speechPitch * pitchMult, speechRate * rateMult);
          }
          setTimeout(() => setIsSpeaking(false), 800);
        }
      };

      // --- CAMERA & EMOTION DETECTION SIMULATOR / HEURISTIC ---
      useEffect(() => {
        let stream = null;
        let animationFrame = null;
        let interval = null;

        if (isCameraEnabled && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(s => {
              stream = s;
              if (videoRef.current) {
                videoRef.current.srcObject = s;
                videoRef.current.play();
                setCameraStatus("Active Feed");
              }
            })
            .catch(err => {
              setCameraStatus("Camera unavailable");
            });
        }

        // Live Vision Gesture Heuristic & Dwell Simulator
        let smileCounter = 0;
        let browCounter = 0;

        interval = setInterval(() => {
          if (!manualEmotion && isCameraEnabled) {
            // Simulated subtle detection for testing preview
            const emotions = ["neutral", "happy", "happy", "neutral", "sad", "angry", "fearful", "surprised"];
            // Keep steady unless manual
          }
        }, 3000);

        return () => {
          if (stream) stream.getTracks().forEach(track => track.stop());
          clearInterval(interval);
        };
      }, [isCameraEnabled, manualEmotion]);

      // --- EMOTION-BASED VOCABULARY RELEVANCE SORTING ---
      const calculateEmotionRelevance = (btn, emotion) => {
        if (!isEmotionSortingEnabled || !emotion || emotion === "neutral") return 0;
        const label = (btn.label || "").toLowerCase();
        const text = (btn.spokenText || "").toLowerCase();
        const target = (btn.targetBoardId || "").toLowerCase();
        let score = 0;

        switch (emotion) {
          case "happy":
            if (["happy", "fun", "good", "great", "smile", "laugh", "love", "like", "play", "yes", "thanks", "more", "favorite", "silly", "cookie", "toys", "game"].includes(label)) score += 30;
            if (["sub_feelings", "sub_toys", "sub_food"].includes(target)) score += 25;
            if (btn.category === "SOCIAL") score += 10;
            break;
          case "sad":
            if (["sad", "bad", "tired", "hurt", "help", "need", "hug", "cry", "home", "mom", "dad", "stop", "sorry", "quiet", "rest", "sleep"].includes(label)) score += 30;
            if (["sub_feelings", "sub_people", "saved_phrases"].includes(target)) score += 25;
            if (btn.category === "ADJECTIVE" || label === "help") score += 15;
            break;
          case "angry":
            if (["angry", "mad", "frustrated", "stop", "no", "bad", "help", "quiet", "leave", "break", "done", "wait"].includes(label)) score += 30;
            if (["sub_feelings", "sub_actions"].includes(target)) score += 25;
            if (label === "stop" || label === "no" || label === "help") score += 35;
            break;
          case "fearful":
            if (["scared", "fear", "help", "safe", "home", "mom", "dad", "stop", "hold", "listen", "quiet", "hide", "no"].includes(label)) score += 30;
            if (["sub_people", "sub_feelings", "sub_places"].includes(target)) score += 25;
            if (label === "help" || label === "home") score += 35;
            break;
          case "disgusted":
            if (["discomfort", "sick", "bathroom", "hurt", "bad", "hot", "cold", "stop", "dirty", "water", "tired"].includes(label)) score += 30;
            if (["sub_feelings", "sub_places", "sub_food"].includes(target)) score += 25;
            if (label === "bathroom" || label === "hurt" || label === "sick") score += 35;
            break;
          case "surprised":
            if (["look", "see", "what", "wow", "big", "different", "new", "fun", "more"].includes(label)) score += 30;
            if (["sub_toys", "sub_actions"].includes(target)) score += 25;
            break;
        }
        return score;
      };

      // Current board buttons sorted by emotion
      const currentBoard = boards[currentBoardId] || PRESET_BOARDS.core_home;
      const displayButtons = useMemo(() => {
        const raw = currentBoard.buttons || [];
        if (isEditMode || !isEmotionSortingEnabled || activeEmotion === "neutral") {
          return raw;
        }
        return [...raw].sort((a, b) => calculateEmotionRelevance(b, activeEmotion) - calculateEmotionRelevance(a, activeEmotion));
      }, [currentBoard, isEditMode, isEmotionSortingEnabled, activeEmotion]);

        if (!lastWord) {
          setSuggestedWords(["I", "want", "like", "go", "help", "more"]);
          return;
        }
        const lw = lastWord.toLowerCase();
        if (["i", "you", "we"].includes(lw)) {
          setSuggestedWords(["want", "like", "need", "feel", "go", "am", "see"]);
        } else if (["want", "need"].includes(lw)) {
          setSuggestedWords(["more", "water", "food", "help", "to play", "bathroom", "home"]);
        } else if (["feel"].includes(lw)) {
          setSuggestedWords(["happy", "sad", "tired", "sick", "good", "frustrated"]);
        } else if (["go"].includes(lw)) {
          setSuggestedWords(["home", "school", "outside", "bathroom", "park"]);
        } else {

          setCurrentBoardId(button.targetBoardId);

                  {/* Results list */}
                  {searchResults.length > 0 && (
                    <div className="grid grid-cols-4 gap-2 mt-3 max-h-36 overflow-y-auto">
                      {searchResults.map((sym, idx) => (
                        <div
                          key={idx}
                          onClick={() => {
                            setNewCardLabel(sym.name);
                            setNewCardSpeech(sym.name);
                            setNewCardIcon("🖼️");
                            // Add image card directly
                            const newBtn = {
                              id: `sym_${Date.now()}_${idx}`,
                              label: sym.name,
                              spokenText: sym.name,
                              category: "NOUN",
                              imageUrl: sym.image_url,
                              tags: ["custom"]
                            };
                            setBoards(prev => ({
                              ...prev,
                              [currentBoardId]: {
                                ...currentBoard,
                                buttons: [...(currentBoard.buttons || []), newBtn]
                              }
                            }));
                            setShowCustomizerModal(false);
                          }}
                          className="bg-white border rounded-lg p-1.5 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500 hover:shadow-xs"
                        >
                          <img src={sym.image_url} alt={sym.name} className="w-8 h-8 object-contain" />
                          <span className="text-[10px] font-bold text-center truncate w-full mt-1">{sym.name}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Manual Add Card Form */}
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Tile Label</label>
                    <input
                      type="text"
                      placeholder="e.g. Playground"
                      value={newCardLabel}
                      onChange={e => setNewCardLabel(e.target.value)}
                      className="w-full border rounded-lg px-2.5 py-1.5 bg-white text-xs"
                    />
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Spoken Text (Utterance)</label>
                    <input
                      type="text"
                      placeholder="e.g. I want to go to the playground"
                      value={newCardSpeech}
                      onChange={e => setNewCardSpeech(e.target.value)}
                      className="w-full border rounded-lg px-2.5 py-1.5 bg-white text-xs"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Fitzgerald Category</label>
                      <select
                        value={newCardCategory}
                        onChange={e => setNewCardCategory(e.target.value)}
                        className="w-full border rounded-lg px-2.5 py-1.5 bg-white text-xs"
                      >
                        <option value="PEOPLE">Yellow - People</option>
                        <option value="ACTION">Green - Action</option>
                        <option value="ADJECTIVE">Blue - Descriptors</option>
                        <option value="NOUN">Orange - Nouns</option>
                        <option value="SOCIAL">Pink - Social</option>
                        <option value="NAVIGATION">Purple - Folder</option>
                      </select>
                    </div>

                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Emoji / Icon</label>
                      <input
                        type="text"
                        placeholder="e.g. 🎪"
                        value={newCardIcon}
                        onChange={e => setNewCardIcon(e.target.value)}
                        className="w-full border rounded-lg px-2.5 py-1.5 bg-white text-xs text-center"
                      />
                    </div>
                  </div>
                </div>

                <div className="mt-5 pt-3 border-t flex justify-end space-x-2">
                  <button
                    onClick={() => setShowCustomizerModal(false)}
                    className="bg-slate-100 text-slate-700 font-bold px-3 py-2 rounded-xl text-xs"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleAddCustomCard}
                    disabled={!newCardLabel.trim()}
                    className="bg-indigo-600 disabled:opacity-40 text-white font-bold px-4 py-2 rounded-xl text-xs"
                  >
                    Add to Board
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SmartAACApp />);
  </script>
</body>
</html>
